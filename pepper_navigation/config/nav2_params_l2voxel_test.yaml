# TEST PROFILE: the L2 as a 3D VoxelLayer in the local costmap.
#
# Same as nav2_params_fastloc.yaml except the local costmap: one voxel layer
# fed by the L2 (no RealSense layer), so the L2's noise can be judged against
# the vertical-evidence rule (mark_threshold) instead of the 2D layer's
# one-point marking. Everything else -- global costmap, controller, collision
# monitor -- is unchanged.
#
#   ros2 launch pepper_navigation costmap_bag.launch.py \
#       params_file:=<this file> localize:=false depth_images:=false
#
# Nav2 params for pepper_nav2_fastloc.launch.py. fastlio_localization publishes
# map -> base_footprint directly: no amcl, no map -> odom split. Obstacle
# sources are PointCloud2.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    # /localization/pose, not /Odometry: /Odometry's twist is in the mast IMU's
    # axes (~64 deg yaw off), this one is in base_footprint. Inert with the
    # current BT (nothing in it reads odom), but correct if that changes.
    odom_topic: /localization/pose
    # 50 ms = 20 Hz, the controller rate. 500 Hz and 100 Hz were both exceeded
    # on the loaded Jetson; faster than the controller buys nothing.
    bt_loop_duration: 50
    default_server_timeout: 20
    wait_for_service_timeout: 5

    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    # Shared with the other profiles (test_shared_nav2_params.py).
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # Horizon = time_steps * model_dt = 2.8 s, ~1.0 m at vx_max: inside the
      # 3 m local costmap and under prune_distance.
      time_steps: 56
      model_dt: 0.05             # must equal 1 / controller_frequency
      batch_size: 2000
      iteration_count: 1
      # Sampling noise per axis; vy 0 as the base is driven diff-drive style.
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.3
      # vx_min 0: no reversing.
      vx_max: 0.35
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.3
      motion_model: "DiffDrive"
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      reset_period: 1.0
      regenerate_noises: false
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # Reads the local costmap's inflation layer: needs an inflation band
      # beyond the inscribed radius to have a gradient to steer on.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false   # circular robot (robot_radius)
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 2.0
      # map, not odom: no odom frame here, and map is smooth (2.1 cm median
      # step) and levelled, so the heights below are metres above the floor.
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.20
      plugins: ["l2_voxel", "inflation_layer"]

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # Must exceed the 0.206 m inscribed radius; ~14 cm band for MPPI's CostCritic.
        inflation_radius: 0.35

      # The L2 in a 3D VoxelLayer instead of the 2D ObstacleLayer, to see
      # whether the vertical evidence rule cuts its noise. ONE source does both
      # marking and clearing: with mark_threshold a flat floor cannot mark (it
      # fills a single voxel), so floor returns can be kept for their rays.
      l2_voxel:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        # Grid: origin_z .. origin_z + z_voxels * z_resolution = 0.15 .. 1.75 m.
        # It starts at the source's height floor: nothing below 0.15 m is used
        # at all, so no voxels are spent under it.
        # z_voxels MAX IS 16 (nav2 packs a column into 32 bits).
        origin_z: 0.15
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.75   # = top of the grid
        # A cell marks only with MORE than 2 marked voxels, i.e. >= 0.3 m of
        # stacked points. This is the knob under test: raise it for less noise
        # and fewer low obstacles, lower it for the opposite.
        mark_threshold: 3
        unknown_threshold: 15
        combination_method: 0       # Overwrite: this layer runs alone here
        observation_sources: points
        points:
          topic: /points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          # 0.15: EVERYTHING below this is discarded before the layer sees it
          # -- it can neither mark nor clear. That drops the floor returns and
          # the reflections under them; the cost is that clearing rays now come
          # only from points above 0.15 m (walls, furniture, legs).
          min_obstacle_height: 0.15
          max_obstacle_height: 1.75
          # 0.40: closer than this the L2 sees Pepper's own body (collision
          # monitor covers that zone). Ranges are 3D from the lidar.
          obstacle_min_range: 0.40
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 4.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.20
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: -0.30
        z_resolution: 0.10
        z_voxels: 16                # max 16; covers -0.30 .. 1.30, see local costmap
        max_obstacle_height: 1.30
        mark_threshold: 2
        unknown_threshold: 10       # must be < z_voxels
        # Max, so a live "free" reading can't erase a wall from the static map.
        combination_method: 1
        observation_sources: points
        points:
          topic: /points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.10
          max_obstacle_height: 1.30     # top of the voxel grid
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          obstacle_max_range: 4.0
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # Above the 0.206 m inscribed radius, and low enough that the planner
        # still fits through doorways.
        inflation_radius: 0.30
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Matches FollowPath's rotation limits, so Spin can't outrun the controller.
    max_rotational_vel: 0.3
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# Collision monitor: independent safety stop on the L2, between the controller
# and the base (cmd_vel_raw -> monitor -> cmd_vel). Reads /points_safety: the
# L2 with Pepper's own body filtered out.
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    # map: there is no odom frame, and with "odom" the monitor never started.
    # base_shift_correction only needs a continuous frame; map is.
    odom_frame_id: "map"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "circle"
      radius: 0.40          # hard stop inside this radius of base_footprint
      action_type: "stop"
      max_points: 3         # trigger when > this many points fall inside
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonSlow:
      type: "circle"
      radius: 0.80          # slow to slowdown_ratio inside this radius
      action_type: "slowdown"
      slowdown_ratio: 0.3
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/points_safety"   # L2 minus its own housing (points_safety_filter)
      # 0.22, not 0.10: the L2 reads the floor up to ~0.20 m high within 0.6 m,
      # which filled both zones. MEASURED: no false trigger at 0.22.
      min_height: 0.22
      max_height: 1.80
      enabled: True
