# Nav2 params for pepper_nav2_fastloc.launch.py: fastlio_localization publishes
# map -> base_footprint directly, so no amcl and no map -> odom split.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    # /localization/pose, not /Odometry: its twist is in base_footprint.
    odom_topic: /localization/pose
    # 20 Hz, the controller rate; faster buys nothing.
    bt_loop_duration: 50
    default_server_timeout: 20
    wait_for_service_timeout: 5

    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    # Shared with the other profiles (test_shared_nav2_params.py).
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.35
      max_vel_y: 0.0
      max_vel_theta: 0.3
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -0.8
      vx_samples: 10
      vy_samples: 0
      vth_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      # No Twirling: it penalises in-place rotation, which is how this base
      # turns; PathAlign/GoalAlign give rotate-then-drive instead.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 20.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 2.0
      # map, not odom: no odom frame, and map is levelled, so the heights
      # below are metres above the floor.
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      
      # Full span, not radius: 10 reaches 5 m.
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.20
      # RealSense only: the L2 was too noisy here. It still feeds the global
      # costmap and the collision monitor. A layer runs only if named here.
      plugins: ["voxel_layer", "inflation_layer"]                  # in use
      # plugins: ["l2_voxel", "inflation_layer"]                   # L2 only
      # plugins: ["l2_voxel", "voxel_layer", "inflation_layer"]    # both: set voxel_layer combination_method 1
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # Must exceed the 0.206 m inscribed radius; 0.25 leaves ~4 cm.
        inflation_radius: 0.25
      
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # RealSense, 3D: dense enough for per-voxel clearing and overhangs.
        publish_voxel_map: True
        # Grid 0.00 .. 1.60 m (z_voxels max is 16).
        origin_z: 0.00
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.60   # = top of the grid
        # Marks on MORE than 2 voxels in a column, i.e. >= 0.3 m of height.
        mark_threshold: 2
        unknown_threshold: 10       # must be < z_voxels to mean anything
        # Overwrite: correct alone. With a layer before it, use 1 (Max).
        combination_method: 0
        # Split marking/clearing; clearing uncapped (3D rays free only what
        # they cross).
        observation_sources: realsense realsense_clear
        
        realsense:
          # Needs the driver's pointcloud.enable:=true.
          topic: /camera/depth/color/points
          data_type: "PointCloud2"
          marking: True
          clearing: False
          # 0.18, not 0.10: body tilt puts floor returns 0.16 m high at 3 m.
          min_obstacle_height: 0.10
          max_obstacle_height: 1.30     # top of the voxel grid
          obstacle_max_range: 5.0       # the 10 m window reaches 5 m
          obstacle_min_range: 0.1
        
        realsense_clear:
          topic: /camera/depth/color/points
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: 0.1     # no height filter
          max_obstacle_height: 2.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.1
          obstacle_max_range: 5.0
          obstacle_min_range: 0.1
      # Inert: not in plugins. Tested L2 settings, kept for reuse.
      l2_voxel:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        # Grid 0.15 .. 1.75 m: starts at the source's height floor.
        origin_z: 0.15
        z_resolution: 0.10
        z_voxels: 16
        max_obstacle_height: 1.75   # = top of the grid
        # Marks on MORE than this many voxels: higher = less noise, fewer
        # low obstacles.
        mark_threshold: 3
        unknown_threshold: 15
        combination_method: 0       # Overwrite: this layer runs alone here
        observation_sources: points
        points:
          topic: /points
          data_type: "PointCloud2"
          marking: True
          clearing: True
          # 0.15: everything below is discarded -- it neither marks nor
          # clears, so floor returns and reflections are dropped.
          min_obstacle_height: 0.15
          max_obstacle_height: 1.75
          # 0.40: closer than this the L2 sees Pepper's own body. 3D from
          # the lidar.
          obstacle_min_range: 0.40
          obstacle_max_range: 4.0
          raytrace_min_range: 0.15
          raytrace_max_range: 4.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.20
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.05
        z_resolution: 0.10
        z_voxels: 16                # max 16; covers -0.30 .. 1.30, see local costmap
        max_obstacle_height: 1.30
        mark_threshold: 2
        unknown_threshold: 10       # must be < z_voxels
        # Max, so a live "free" reading can't erase a wall from the static map.
        combination_method: 1
        observation_sources: points
        points:
          topic: /points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.10
          max_obstacle_height: 1.30     # top of the voxel grid
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          obstacle_max_range: 4.0
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # Above the 0.206 m inscribed radius, low enough for doorways.
        inflation_radius: 0.30
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Matches FollowPath's limits so Spin can't outrun the controller.
    max_rotational_vel: 0.3
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# Collision monitor: safety stop on the L2, between controller and base
# (cmd_vel_raw -> monitor -> cmd_vel). /points_safety = L2 minus Pepper.
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    # map: there is no odom frame, and base_shift_correction only needs a
    # continuous one.
    odom_frame_id: "map"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "circle"
      radius: 0.40          # hard stop inside this radius of base_footprint
      action_type: "stop"
      max_points: 3         # trigger when > this many points fall inside
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonSlow:
      type: "circle"
      radius: 0.80          # slow to slowdown_ratio inside this radius
      action_type: "slowdown"
      slowdown_ratio: 0.3
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/points_safety"   # L2 minus its own housing (points_safety_filter)
      # 0.22, not 0.10: the L2 reads the floor up to ~0.20 m high near in.
      min_height: 0.22
      max_height: 1.80
      enabled: True
