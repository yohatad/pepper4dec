# Nav2 params for pepper_nav2_fastloc.launch.py. fastlio_localization keeps
# the prior map inside the filter and publishes map -> base_footprint directly,
# so there is no amcl and no map -> odom split; nav2_map_server serves the
# matching 2D grid for the static layer. Obstacle sources are PointCloud2.
#
# keepout_filter is NOT enabled: keepout_zone.yaml's mask targets a deleted map
# (rtabmap_march_28). Regenerate with utils/generate_keepout.py first.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    # /localization/pose, not /Odometry: /Odometry's twist is in the mast IMU's
    # axes (~64 deg yaw off), this one is in base_footprint. Inert with the
    # current BT (nothing in it reads odom), but correct if that changes.
    odom_topic: /localization/pose
    # 50 ms = 20 Hz, the controller rate. 500 Hz and 100 Hz were both exceeded
    # on the loaded Jetson; faster than the controller buys nothing.
    bt_loop_duration: 50
    default_server_timeout: 20
    wait_for_service_timeout: 5

    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    # Shared with the other profiles (test_shared_nav2_params.py).
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.35
      max_vel_y: 0.0
      max_vel_theta: 0.3
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -0.8
      vx_samples: 10
      vy_samples: 0
      vth_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      # No Twirling: it penalises ALL rotation, in-place included, which is
      # how this base turns. Rotate-then-drive comes from PathAlign/GoalAlign
      # with a short forward_point_distance instead.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 20.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 2.0
      # map, not odom: there is no odom frame. map is also smooth enough
      # (MEASURED 2.1 cm median step, none over 0.30 m) and levelled, so the
      # height bands below read as height above the floor.
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      # Full span, not radius: 6 gives a 3 m reach, matching the sensors.
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.20
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # Must exceed the inscribed radius (0.206 m) or inflation sits inside
        # the robot. 0.35 leaves ~14 cm of clearance.
        inflation_radius: 0.35
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # L2 only, 2D. The L2 is too sparse for per-voxel clearing (marks
        # outlived the obstacle); a 2D ray clears the whole column. The
        # voxel_layer adds 3D detail in the camera cone.
        max_obstacle_height: 1.70
        # Overwrite, so a cleared cell actually clears.
        combination_method: 0
        # One topic, two sources: the height band filters BOTH marking and
        # clearing, and the band safe to mark from throws away the floor
        # returns that clear best. Split, clearing rays went 1049 -> ~2400
        # per scan.
        observation_sources: points points_clear
        points:
          topic: /points
          data_type: "PointCloud2"
          marking: True
          clearing: False
          min_obstacle_height: 0.10     # above the floor
          max_obstacle_height: 1.70
          obstacle_max_range: 4.0
          obstacle_min_range: 0.1
        points_clear:
          topic: /points
          data_type: "PointCloud2"
          marking: False
          clearing: True
          # Capped at the L2's own height (0.258 m). A higher endpoint means an
          # ascending ray that can pass OVER a low obstacle and clear its
          # column -- opening this to 10.0 erased a 30 cm box.
          min_obstacle_height: 0.1     # keep floor returns
          max_obstacle_height: 1.76     # = L2 height above the floor
          raytrace_max_range: 4.0       # >= obstacle_max_range, or ghosts
          # Rejects the whole return, not just the near part of the ray; 0.5
          # dropped a third of the cloud. Below 0.15 is Pepper's body.
          raytrace_min_range: 0.15
          obstacle_max_range: 4.0
          obstacle_min_range: 0.15
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # RealSense only, 3D, forward cone. Dense enough for per-voxel
        # clearing, so it resolves overhangs the 2D L2 layer cannot.
        publish_voxel_map: True
        origin_z: -0.30            # below the floor, so the sensor is in the grid
        z_resolution: 0.10
        z_voxels: 20                # 8 * 0.25 = 2.0 m -> covers -0.30 .. 1.70
        max_obstacle_height: 1.70
        # Ignores stray voxels, but with 0.25 m bins it also cannot mark
        # anything under ~0.5 m. Low obstacles are the L2 layer's job; don't
        # lower this to catch them.
        mark_threshold: 2
        unknown_threshold: 10       # must be < z_voxels to mean anything
        # Max, not Overwrite: this layer only ADDS. Overwrite wrote its unmarked
        # cells FREE over the L2's marks and erased a 30 cm box.
        combination_method: 1
        # Split like the L2 layer, but uncapped: a 3D ray clears only the
        # voxels it crosses, so it cannot erase what it passes over.
        observation_sources: realsense realsense_clear
        realsense:
          # Needs the driver's pointcloud.enable:=true.
          topic: /camera/depth/color/points
          data_type: "PointCloud2"
          marking: True
          clearing: False
          # 0.18, not 0.10: the ~3 deg body tilt put floor returns 0.16 m high
          # at 3 m. Still below the L2's 0.20.
          min_obstacle_height: 0.18
          max_obstacle_height: 1.70
          obstacle_max_range: 4.0       # D435i reliable to ~3 m
          obstacle_min_range: 0.1
        realsense_clear:
          topic: /camera/depth/color/points
          data_type: "PointCloud2"
          marking: False
          clearing: True
          min_obstacle_height: 0.1     # no height filter
          max_obstacle_height: 10.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          obstacle_max_range: 4.0
          obstacle_min_range: 0.1
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.20
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: -0.30
        z_resolution: 0.10
        z_voxels: 20                # covers -0.30 .. 1.70
        max_obstacle_height: 1.70
        mark_threshold: 2
        unknown_threshold: 10       # must be < z_voxels
        # Max, so a live "free" reading can't erase a wall from the static map.
        combination_method: 1
        observation_sources: points
        points:
          topic: /points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.10
          max_obstacle_height: 1.70
          raytrace_max_range: 4.0
          raytrace_min_range: 0.1
          obstacle_max_range: 4.0
          obstacle_min_range: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # Above the 0.206 m inscribed radius; lower than local's 0.35 so the
        # planner still fits through doorways.
        inflation_radius: 0.30
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Matches FollowPath's rotation limits, so Spin can't outrun the controller.
    max_rotational_vel: 0.3
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# Collision monitor: independent safety stop on the L2, between the controller
# and the base (cmd_vel_raw -> monitor -> cmd_vel). Reads /points_safety, the
# L2 with Pepper's own body filtered out, or the robot would stop itself.
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    # map: there is no odom frame, and with "odom" the monitor never started.
    # base_shift_correction only needs a continuous frame; map is.
    odom_frame_id: "map"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "circle"
      radius: 0.40          # hard stop inside this radius of base_footprint
      action_type: "stop"
      max_points: 3         # trigger when > this many points fall inside
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonSlow:
      type: "circle"
      radius: 0.80          # slow to slowdown_ratio inside this radius
      action_type: "slowdown"
      slowdown_ratio: 0.3
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/points_safety"   # L2 minus its own housing (points_safety_filter)
      # 0.22, not 0.10: the L2 reads the floor up to ~0.20 m high within
      # 0.6 m, which filled both zones. MEASURED: no false trigger at 0.22.
      min_height: 0.22
      max_height: 1.80
      enabled: True
