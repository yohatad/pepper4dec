# Nav2 params for the FAST-LIO + RTAB-Map (localization mode) stack.
# Separate from nav2_params.yaml (the AMCL + map_server config already in
# this package) -- that one is left untouched in case it's still in use
# elsewhere; this is the new RTAB-Map-localization-based path.
#
# No amcl / map_server / filter_mask_server / costmap_filter_info_server
# here -- RTAB-Map itself publishes /map (transient_local) in localization
# mode, same as it does while mapping, so the global costmap's static_layer
# subscribes to it directly. Controller/planner/behavior tuning below is
# carried over unchanged from nav2_params.yaml (already tuned against the
# real robot); only frames and the costmap observation source changed
# (PointCloud2 on /points, replacing the LaserScan/AMCL-era 2D scan
# requirement -- no pointcloud_to_laserscan flattening step needed).
#
# NOT carried over: the keepout_filter zone. keepout_zone.yaml's mask was
# authored against map/rtabmap_march_28.yaml's map frame -- re-generate it
# against the current map before re-enabling that layer.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    # FAST-LIO's own /Odometry now publishes real twist (not all-zero) --
    # see laserMapping.cpp's publish_odometry(). Frame_id is FAST-LIO's
    # IMU-tilted "lio_init", not the gravity-leveled "odom" the rest of
    # this TF tree uses, but bt_navigator only reads this for velocity-based
    # BT conditions (is_stuck / distance_traveled), not pose lookups, so the
    # frame mismatch doesn't matter here.
    odom_topic: /odom_lio   # shared LIO odometry; every mapping launch remaps onto it
    bt_loop_duration: 2
    default_server_timeout: 20
    wait_for_service_timeout: 5

    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    # DWB tuning unchanged from nav2_params.yaml -- already tuned against
    # the real robot, no reason to re-derive it.
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 10
      vy_samples: 0
      vth_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 20.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 2.0
      # odom (the LEVELED frame), not raw lio_init. lio_init is backend-native: FAST-LIO leaves
      # it at the IMU mount orientation (~90 deg off gravity here) while
      # Point-LIO gravity-aligns it, so the SAME name means different geometry
      # per backend and the height bands below would slice the cloud along the
      # wrong axis. odom is gravity-aligned and floor-referenced on every
      # backend (lio_odom_bridge, level_source=calibration), published as a
      # child of odom here since transform_fusion owns map -> odom.
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.25
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.30
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # VoxelLayer (not ObstacleLayer): keeps a 3D voxel column grid and
        # clears per-voxel, so a tilted 360 deg 3D lidar + moving obstacles
        # (people) clear reliably without leaving stale marks behind. The voxel
        # grid spans the obstacle band: origin_z .. origin_z + z_voxels*z_res.
        publish_voxel_map: True
        # FLOOR-referenced now (global_frame is odom): plain heights
        # above the ground. Old raw-odom values +0.30. z_voxels max is 16 --
        # nav2's VoxelGrid packs a column into a 32-bit word.
        origin_z: -0.30            # 0.30 m BELOW the floor: keeps the sensor
                                   # origin (L2 ~0.25 m up, plus drift) inside
                                   # the grid so VoxelLayer can raytrace-clear.
        z_resolution: 0.125        # voxel height
        z_voxels: 16               # 16 * 0.125 = 2.0 m -> covers -0.30 .. 1.70
        max_obstacle_height: 1.70
        mark_threshold: 0          # marked voxels in a column to flag the 2D cell (0 = any)
        unknown_threshold: 15
        combination_method: 1
        # L2 lidar = primary all-around (360 deg) obstacle source; RealSense
        # depth = complementary DENSE forward source for the low/small/overhang
        # obstacles the sparse tilted L2 sweep misses. See obstacle_min_range
        # notes below -- the low-mounted L2 sees Pepper's own body up close.
        observation_sources: points realsense
        points:
          topic: /points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # Height band is in odom, which is FLOOR-referenced (z=0 IS
          # the ground plane), so these read directly as height above the
          # floor. min_obstacle_height MUST stay above the floor or the floor
          # is marked as an obstacle; keep it low enough (0.10 m) to still
          # catch low objects/chair legs.
          min_obstacle_height: 0.10
          max_obstacle_height: 1.70
          raytrace_max_range: 3.0
          # Skip the near field: the L2 is mounted low (~0.26 m up) and sees
          # Pepper's own body as a dense cluster ~0.3-0.6 m out. With min_range
          # 0.0 the robot marks ITSELF as an obstacle in the local costmap and
          # freezes. 0.8 m clears the self-hits (measured self-hit shell < 0.6 m).
          raytrace_min_range: 0.8
          obstacle_max_range: 2.5
          obstacle_min_range: 0.8
        realsense:
          # RealSense D435i depth cloud. Requires the driver launched with
          # pointcloud.enable:=true (it is disabled during recording). Narrow
          # ~87 deg forward FOV, so it only COMPLEMENTS the L2 -- never make it
          # the sole source (blind to the sides/rear).
          topic: /camera/depth/color/points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.10
          max_obstacle_height: 1.70
          # D435i reliable depth ~0.3-3 m; below 0.3 m it is blind.
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 3.0
          obstacle_min_range: 0.3
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # VoxelLayer for the same per-voxel 3D clearing as the local costmap.
        publish_voxel_map: True
        origin_z: -0.30            # floor-referenced, see local costmap
        z_resolution: 0.125
        z_voxels: 16               # 16 * 0.125 = 2.0 m -> covers -0.30 .. 1.70
        max_obstacle_height: 1.70
        mark_threshold: 0
        unknown_threshold: 15
        combination_method: 1
        observation_sources: points
        points:
          topic: /points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.10
          max_obstacle_height: 1.70
          raytrace_max_range: 3.0
          # Same as the local costmap: skip the L2 self-hits (Pepper's own body
          # ~0.3-0.6 m from the low lidar) so the robot doesn't mark itself.
          raytrace_min_range: 0.8
          obstacle_max_range: 2.5
          obstacle_min_range: 0.8
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.20
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# ---------------------------------------------------------------------------
# Collision Monitor -- independent safety layer that reads the L2 lidar
# directly and slows/stops the robot regardless of the costmap or planner.
# Sits in the cmd_vel chain: controller/behavior -> cmd_vel_raw -> monitor ->
# cmd_vel (what Pepper actually drives on).
#
# SELF-HITS: it consumes /points_safety (the L2 range-filtered to drop Pepper's
# own body < 0.8 m), NOT raw /points -- otherwise the robot's own structure sits
# inside the stop zone and freezes it. min_height/max_height are in the
# base_footprint frame (floor at z=0), so 0.10..1.80 skips floor and ceiling.
# ---------------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "circle"
      radius: 0.40          # hard stop inside this radius of base_footprint
      action_type: "stop"
      max_points: 3         # trigger when > this many points fall inside
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonSlow:
      type: "circle"
      radius: 0.80          # slow to slowdown_ratio inside this radius
      action_type: "slowdown"
      slowdown_ratio: 0.3
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/points_safety"   # L2 self-hit-filtered (see cloud_range_filter)
      min_height: 0.10
      max_height: 1.80
      enabled: True
