# Nav2 params for AMCL + map_server on FAST-LIO odometry -- the baseline to
# compare the LIO localization stacks against.
#
# TF: amcl owns map -> odom; lio_odom_bridge owns odom -> base_footprint and a
# levelled odom -> lio_init. AMCL must correct the LEVELLED odom (run with
# bridge_level_frame:=true): FAST-LIO's raw frame is ~90 deg off gravity and
# breaks AMCL's planar motion model.
#
# AMCL localizes on /scan, flattened from /points by pointcloud_to_laserscan;
# the costmaps still use 3D /points. keepout_filter is NOT enabled (its mask
# targets an older map).

# AMCL: particle filter over /scan against map_server's grid.
amcl:
  ros__parameters:
    use_sim_time: False
    # Lower than wheel-odom's 0.2: FAST-LIO is ~10x better, and 0.2 spread
    # particles too wide in corridors. Raise if re-convergence struggles.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    # The levelled odom -- see the header.
    odom_frame_id: "odom"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_model_type: "likelihood_field"
    # Match pointcloud_to_laserscan. 0.8 m drops Pepper's own body, which
    # otherwise stops AMCL converging.
    laser_min_range: 0.8
    laser_max_range: 20.0
    # 60 of 720 was too thin to catch the few features that fix position
    # along a corridor.
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    # No random-particle recovery: it would hide real divergence.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # Every update: 2 measured jumpier (5.6 vs 3.4 cm mean).
    resample_interval: 1
    # Holonomic base: allow lateral motion even though DWB never commands it.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    # likelihood_field reads only z_hit/z_rand/sigma_hit. 0.9/0.1 with a
    # tight sigma_hit rewards good matches; z_rand 0.5 flattened the weights.
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan  # no leading slash; pointcloud_to_laserscan publishes /scan
    # Start UNLOCALIZED and wait for RViz's 2D Pose Estimate: the map origin
    # [-19.5, -28.5] is nowhere near where Pepper starts.
    set_initial_pose: false

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    # Only used for velocity checks, so the unlevelled frame is harmless.
    odom_topic: /odom_lio   # shared LIO odometry; every mapping launch remaps onto it
    bt_loop_duration: 2
    default_server_timeout: 20
    wait_for_service_timeout: 5

    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
