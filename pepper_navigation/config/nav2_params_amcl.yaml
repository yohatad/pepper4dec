controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    # Shared with the other profiles (test_shared_nav2_params.py).
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.35
      max_vel_y: 0.0
      max_vel_theta: 0.3
      min_speed_xy: 0.0
      max_speed_xy: 0.35
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -0.8
      vx_samples: 10
      vy_samples: 0
      vth_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 20.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 2.0
      # Levelled odom: smooth (map jumps with AMCL) and level, which the
      # height bands below need.
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.25
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.40
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # Grid spans origin_z .. origin_z + z_voxels*z_resolution.
        publish_voxel_map: True
        # Below the floor, so the sensor is always inside the grid; outside
        # it VoxelLayer clears nothing.
        origin_z: -0.30            # bottom of grid, i.e. 0.30 m BELOW the floor
        # 16 is the max (one 32-bit word per column). 0.125 * 16 = 2.0 m.
        z_resolution: 0.125        # voxel height
        z_voxels: 16               # 16 * 0.125 = 2.0 m -> covers -0.30 .. 1.70
        max_obstacle_height: 1.70
        mark_threshold: 0          # marked voxels in a column to flag the 2D cell (0 = any)
        unknown_threshold: 15
        combination_method: 1
        # L2: 360 deg. RealSense: dense forward detail the L2 misses.
        observation_sources: points realsense
        points:
          # Self-hit and ground filtered (points_costmap_filter in the launch).
          topic: /points_costmap
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # 0.30, not 0.10: levelling is a one-time snapshot, so the apparent
          # floor drifts over a run.
          min_obstacle_height: 0.30
          max_obstacle_height: 1.70
          raytrace_max_range: 3.0
          # Skip Pepper's own body (0.3-0.6 m out).
          raytrace_min_range: 0.8
          obstacle_max_range: 2.5
          obstacle_min_range: 0.8
        realsense:
          # Needs the driver's pointcloud.enable:=true. Forward only.
          topic: /camera/depth/color/points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # Floor-referenced, same as the points source above.
          min_obstacle_height: 0.30
          max_obstacle_height: 1.70
          # D435i reliable depth ~0.3-3 m; below 0.3 m it is blind.
          raytrace_max_range: 5.0
          raytrace_min_range: 0.3
          obstacle_max_range: 5.0
          obstacle_min_range: 0.3
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        # Below the floor, as in the local costmap.
        origin_z: -0.30
        z_resolution: 0.125        # see local costmap: z_voxels max is 16
        z_voxels: 16               # 16 * 0.125 = 2.0 m -> covers -0.30 .. 1.70
        max_obstacle_height: 1.70
        mark_threshold: 0
        unknown_threshold: 15
        combination_method: 1
        observation_sources: points
        points:
          # Same filtered topic as the local costmap.
          topic: /points_costmap
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # Higher than local's 0.30: only burn confidently tall structure
          # into the persistent map.
          min_obstacle_height: 0.80
          max_obstacle_height: 1.70
          raytrace_max_range: 5.0
          # Skip Pepper's own body.
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.30
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Matches FollowPath's rotation limits, so Spin can't outrun the controller.
    max_rotational_vel: 0.3
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# Collision monitor: independent safety stop on the L2, between the controller
# and the base (cmd_vel_raw -> monitor -> cmd_vel). Reads /points_safety, the
# L2 with Pepper's own body filtered out, or the robot would stop itself.
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    # Levelled odom, as in the local costmap.
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "circle"
      radius: 0.40          # hard stop inside this radius of base_footprint
      action_type: "stop"
      max_points: 3         # trigger when > this many points fall inside
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonSlow:
      type: "circle"
      radius: 0.80          # slow to slowdown_ratio inside this radius
      action_type: "slowdown"
      slowdown_ratio: 0.3
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/points_safety"   # L2 minus its own housing (points_safety_filter)
      # 0.22, not 0.10: the L2 reads the floor up to ~0.20 m high within
      # 0.6 m, which filled both zones. MEASURED: no false trigger at 0.22.
      min_height: 0.22
      max_height: 1.80
      enabled: True
