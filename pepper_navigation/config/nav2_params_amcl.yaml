# Nav2 params for the AMCL + map_server stack on FAST-LIO odometry -- the
# baseline localization path, for comparison against the LIO stacks
# (nav2_params_fastloc.yaml, nav2_params_rtabmap_loc.yaml). Tuning outside the
# amcl block is meant to match fastloc; test_shared_nav2_params.py guards the
# three node blocks that must not drift.
#
# Transform owners:
#   map -> odom              amcl (tf_broadcast: true)
#   odom -> lio_init         lio_odom_bridge, static one-time levelling
#   odom -> base_footprint   lio_odom_bridge (from FAST-LIO's /Odometry)
#
# AMCL corrects odom, NOT lio_init: its motion model assumes a level planar
# frame, and FAST-LIO's raw frame is ~90 deg off gravity on this mount (the L2
# IMU reads gravity along +X), so forward travel lands on the ignored Z axis and
# the pose jumps on every scan update. odom is the bridge's levelled frame, so
# mapping.launch.py must run with bridge_level_frame:=true.
#
# AMCL needs a LaserScan: the launch runs pointcloud_to_laserscan to flatten
# /points -> /scan for localization only; the costmaps below still use 3D
# /points. That scan's height band and range limits are the knobs if AMCL will
# not converge.
#
# keepout_filter is NOT enabled: keepout_zone.yaml's mask targets an older map.
# Regenerate it before re-enabling that layer.

# ---------------------------------------------------------------------------
# AMCL -- particle filter over the flattened /scan against map_server's grid.
# Alpha/z_*/beam params come from nav2_params.yaml; frames, ranges and the
# initial-pose policy are changed.
# ---------------------------------------------------------------------------
amcl:
  ros__parameters:
    use_sim_time: False
    # Motion model noise. nav2_params.yaml's 0.2 describes WHEEL odometry;
    # FAST-LIO is ~an order of magnitude better, so 0.2 sprays particles wider
    # than the real error -- worst in a corridor, where along-corridor position
    # is unobservable and nothing pulls the spread back. Raise again if the
    # filter struggles to RE-converge after being lost.
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.05
    alpha5: 0.05
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    # odom (the LEVELED frame), not lio_init and not pepper_odom. The raw FAST-LIO odom frame is
    # tilted ~90deg and breaks the planar motion model -- see the header.
    odom_frame_id: "odom"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_model_type: "likelihood_field"
    # Must bracket pointcloud_to_laserscan's range_min/range_max. 0.8 m drops
    # the L2 self-hits (Pepper's body sits ~0.3-0.6 m from the low lidar); at
    # -1.0 the filter matches the robot's own structure and never converges.
    laser_min_range: 0.8
    laser_max_range: 20.0
    # Beams subsampled from the 720-beam flattened scan. 60 is thin for a
    # corridor: the few beams that constrain along-corridor position (doorways,
    # alcoves, the corridor end) are the ones a sparse subsample misses.
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    # Random-particle recovery off: with FAST-LIO odometry the filter should
    # not need to re-scatter, and injected particles would hide real
    # divergence.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # Resample every update. 2 measured WORSE on the July_22 bag (mean jump
    # 5.6 cm vs 3.4 cm): half the corrections, each carrying twice the error,
    # which is exactly what reads as "jumping".
    resample_interval: 1
    # Pepper drives holonomically, so the motion model must allow lateral
    # motion (recoveries, teleop nudges) even though DWB below samples vy=0.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    save_pose_rate: 0.5
    # likelihood_field uses z_hit/z_rand/sigma_hit only (z_max/z_short belong
    # to the unused beam model). z_rand 0.5 put half the likelihood on uniform
    # noise, flattening the weights so particles were hard to tell apart --
    # worst in a corridor. 0.9/0.1 plus a tighter sigma_hit rewards a good
    # match.
    sigma_hit: 0.1
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.9
    z_max: 0.05
    z_rand: 0.1
    z_short: 0.05
    scan_topic: scan  # no leading slash; pointcloud_to_laserscan publishes /scan
    # Start UNLOCALIZED and wait for RViz's 2D Pose Estimate: the map origin
    # [-19.5, -28.5] is nowhere near where Pepper starts.
    set_initial_pose: false

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    # bt_navigator reads this only for velocity-based BT conditions, never for
    # pose lookups, so the frame mismatch (lio_init, not the levelled odom) is
    # harmless here.
    odom_topic: /odom_lio   # shared LIO odometry; every mapping launch remaps onto it
    bt_loop_duration: 2
    default_server_timeout: 20
    wait_for_service_timeout: 5

    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    # DWB tuning unchanged from nav2_params.yaml -- already tuned against
    # the real robot, no reason to re-derive it.
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 10
      vy_samples: 0
      vth_samples: 20
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.1
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 20.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 2.0
      # odom: the levelled parent of FAST-LIO's frame. It moves smoothly while
      # map jumps on each AMCL update, and it is level, which the height bands
      # below require -- in the raw tilted frame they would slice the cloud
      # sideways and mark walls as floor. Needs bridge_level_frame:=true.
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.25
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.40
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # VoxelLayer, not ObstacleLayer: per-voxel 3D clearing, needed for a
        # tilted 3D lidar and moving obstacles. Grid spans origin_z ..
        # origin_z + z_voxels*z_resolution.
        publish_voxel_map: True
        # Heights are metres above the floor (odom's z=0 is the ground plane).
        # origin_z stays below 0 so the sensor origin (L2 ~0.25 m up, plus
        # levelling drift) always falls inside the grid's Z bounds -- outside
        # them VoxelLayer logs "sensor origin out of map bounds" and clears
        # nothing, so marks accumulate forever. Floor exclusion itself is
        # points_costmap_filter's job upstream, not this band.
        origin_z: -0.30            # bottom of grid, i.e. 0.30 m BELOW the floor
        # z_voxels max is 16: nav2 packs a column into a 32-bit word. Above it
        # the layer never builds the grid and publishes nothing. 0.125 * 16 =
        # 2.0 m spans origin_z .. max_obstacle_height.
        z_resolution: 0.125        # voxel height
        z_voxels: 16               # 16 * 0.125 = 2.0 m -> covers -0.30 .. 1.70
        max_obstacle_height: 1.70
        mark_threshold: 0          # marked voxels in a column to flag the 2D cell (0 = any)
        unknown_threshold: 15
        combination_method: 1
        # L2 = primary 360 deg source; RealSense depth = dense forward
        # complement for low/small/overhang obstacles the sparse L2 sweep
        # misses. The low-mounted L2 also sees Pepper's own body up close.
        observation_sources: points realsense
        points:
          # Self-hit + ground-plane-filtered /points (points_costmap_filter in
          # the launch file), NOT raw /points.
          topic: /points_costmap
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # Heights above the floor (odom is floor-referenced). Must stay above
          # the floor or the floor marks as an obstacle; 0.30 because the
          # levelling snapshot is taken once at t=0 and residual tilt drifts the
          # apparent floor height over a run -- 0.10 was not enough.
          min_obstacle_height: 0.30
          max_obstacle_height: 1.70
          raytrace_max_range: 3.0
          # Skip the near field: the low-mounted L2 (~0.26 m up) sees Pepper's
          # own body ~0.3-0.6 m out and would otherwise mark ITSELF as an
          # obstacle and freeze.
          raytrace_min_range: 0.8
          obstacle_max_range: 2.5
          obstacle_min_range: 0.8
        realsense:
          # D435i depth. Needs the driver launched with pointcloud.enable:=true
          # (off during recording). ~87 deg forward FOV -- complement only,
          # blind to the sides and rear.
          topic: /camera/depth/color/points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # Floor-referenced, same as the points source above.
          min_obstacle_height: 0.30
          max_obstacle_height: 1.70
          # D435i reliable depth ~0.3-3 m; below 0.3 m it is blind.
          raytrace_max_range: 5.0
          raytrace_min_range: 0.3
          obstacle_max_range: 5.0
          obstacle_min_range: 0.3
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.25
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # VoxelLayer for the same per-voxel 3D clearing as the local costmap.
        publish_voxel_map: True
        # See the local costmap. Heights above the floor; origin_z stays below
        # it so the sensor origin is always inside the grid's Z bounds, or
        # VoxelLayer cannot raytrace-clear and marks accumulate. Floor exclusion
        # is points_costmap_filter's job.
        origin_z: -0.30
        z_resolution: 0.125        # see local costmap: z_voxels max is 16
        z_voxels: 16               # 16 * 0.125 = 2.0 m -> covers -0.30 .. 1.70
        max_obstacle_height: 1.70
        mark_threshold: 0
        unknown_threshold: 15
        combination_method: 1
        observation_sources: points
        points:
          # Same filtered topic as the local costmap -- see
          # points_costmap_filter in pepper_nav2_amcl.launch.py.
          topic: /points_costmap
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # 0.80 m above the floor, higher than the local costmap's 0.30 on
          # purpose: the global map is persistent, so only confidently-tall
          # structure should be burned into it.
          min_obstacle_height: 0.80
          max_obstacle_height: 1.70
          raytrace_max_range: 5.0
          # Same as the local costmap: skip the L2 self-hits (Pepper's own body
          # ~0.3-0.6 m from the low lidar) so the robot doesn't mark itself.
          raytrace_min_range: 0.2
          obstacle_max_range: 2.5
          obstacle_min_range: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.30
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# ---------------------------------------------------------------------------
# Collision Monitor -- safety layer in the cmd_vel chain, independent of the
# costmap and planner: controller/behavior -> cmd_vel_raw -> monitor -> cmd_vel.
# Reads /points_safety (L2 filtered to drop Pepper's own body < 0.8 m), NOT raw
# /points, or the robot's own structure freezes it. min/max_height are in
# base_footprint with the floor at z=0.
# ---------------------------------------------------------------------------
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    # odom, matching the local costmap: base_shift_correction extrapolates
    # the robot's motion in this frame, so it must be the level one.
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "circle"
      radius: 0.40          # hard stop inside this radius of base_footprint
      action_type: "stop"
      max_points: 3         # trigger when > this many points fall inside
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonSlow:
      type: "circle"
      radius: 0.80          # slow to slowdown_ratio inside this radius
      action_type: "slowdown"
      slowdown_ratio: 0.3
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/points_safety"   # L2 self-hit-filtered (see cloud_range_filter)
      min_height: 0.10
      max_height: 1.80
      enabled: True
