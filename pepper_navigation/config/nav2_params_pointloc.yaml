# Nav2 params for pepper_nav2_pointloc.launch.py. pointlio_localization keeps
# the prior map inside the filter and publishes map -> base_footprint directly,
# so there is no amcl and no map -> odom split; nav2_map_server serves the
# matching 2D grid for the static layer. Obstacle sources are PointCloud2.
#
# Kept the same as nav2_params_fastloc.yaml on purpose: the two stacks differ
# only in the LIO backend, so any behavioural difference is a backend
# difference. test_shared_nav2_params.py guards the three shared node blocks.

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    # Inert today: odom_topic is bt_navigator-only and feeds an OdomSmoother the
    # active BT never reads. Set to /localization/pose anyway -- it is framed in
    # base_footprint, while /Odometry and /odom_lio use the mast IMU frame
    # (~64 deg of yaw off), so their twist is wrong for anything directional.
    odom_topic: /localization/pose
    # 20 Hz, matching controller_frequency. 500 Hz and Nav2's default 100 Hz
    # were both exceeded on this Jetson under full load, and the tree only waits
    # on a 20 Hz controller. A "tick rate exceeded" warning here is a real stall.
    bt_loop_duration: 50
    default_server_timeout: 20
    wait_for_service_timeout: 5

    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    # Shared with the other profiles (test_shared_nav2_params.py).
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # Horizon = time_steps * model_dt = 2.8 s, ~1.0 m at vx_max: inside the
      # 3 m local costmap and under prune_distance.
      time_steps: 56
      model_dt: 0.05             # must equal 1 / controller_frequency
      batch_size: 2000
      iteration_count: 1
      # Sampling noise per axis; vy 0 as the base is driven diff-drive style.
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.3
      # vx_min 0: no reversing.
      vx_max: 0.35
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.3
      motion_model: "DiffDrive"
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      reset_period: 1.0
      regenerate_noises: false
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      # Reads the local costmap's inflation layer: needs an inflation band
      # beyond the inscribed radius to have a gradient to steer on.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false   # circular robot (robot_radius)
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 2.0
      # map, not odom: this stack has no odom frame (the localizer's state IS
      # the map pose). The usual "map jumps, odom does not" objection does not
      # apply -- measured 2.1 cm median step, 4.5 cm max, none over 0.30 m. map
      # is also gravity-aligned and floor-referenced, which the height bands
      # below require; raw lio_init is ~90 deg off gravity.
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.20
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # Must exceed the inscribed radius (robot_radius 0.20 + 0.01 footprint
        # padding = 0.206 m), or inflation sits inside the robot's own body and
        # the planner paths closer than its radius. 0.35 leaves ~14 cm.
        inflation_radius: 0.35
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # VoxelLayer, not ObstacleLayer: per-voxel 3D clearing, needed for a
        # tilted 3D lidar and moving obstacles. Grid spans origin_z ..
        # origin_z + z_voxels*z_resolution.
        publish_voxel_map: True
        # Heights above the floor (global_frame map is levelled). z_voxels max
        # is 16: nav2 packs a column into a 32-bit word.
        origin_z: -0.30            # 0.30 m BELOW the floor: keeps the sensor
                                   # origin (L2 ~0.25 m up, plus drift) inside
                                   # the grid so VoxelLayer can raytrace-clear.
        z_resolution: 0.125        # voxel height
        z_voxels: 16               # 16 * 0.125 = 2.0 m -> covers -0.30 .. 1.70
        max_obstacle_height: 1.70
        mark_threshold: 1          # marked voxels in a column to flag the 2D cell (0 = any)
        unknown_threshold: 15
        combination_method: 1
        # L2 = primary 360 deg source; RealSense depth = dense forward
        # complement for low/small/overhang obstacles the sparse L2 sweep
        # misses. The low-mounted L2 also sees Pepper's own body up close.
        observation_sources: points realsense
        points:
          topic: /points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # Heights above the floor (evaluated in global_frame map, levelled so
          # z=0 is the ground). min_obstacle_height must stay above the floor or
          # the floor marks as an obstacle, but low enough to catch chair legs.
          min_obstacle_height: 0.20
          max_obstacle_height: 1.70
          raytrace_max_range: 3.0
          raytrace_min_range: 0.5
          obstacle_max_range: 4.0
          obstacle_min_range: 0.5
        realsense:
          # D435i depth. Needs the driver launched with pointcloud.enable:=true
          # (off during recording). ~87 deg forward FOV -- complement only,
          # blind to the sides and rear.
          topic: /camera/depth/color/points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # 0.18, not 0.10: the ~3 deg body tilt put floor returns 0.16 m high
          # at 3 m. Still below the L2's 0.20.
          min_obstacle_height: 0.18
          max_obstacle_height: 1.70
          # D435i reliable depth ~0.3-3 m; below 0.3 m it is blind.
          raytrace_max_range: 3.0
          raytrace_min_range: 0.3
          obstacle_max_range: 3.0
          obstacle_min_range: 0.3
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      robot_radius: 0.20
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        # VoxelLayer for the same per-voxel 3D clearing as the local costmap.
        publish_voxel_map: True
        origin_z: -0.30            # floor-referenced, see local costmap
        z_resolution: 0.125
        z_voxels: 16               # 16 * 0.125 = 2.0 m -> covers -0.30 .. 1.70
        max_obstacle_height: 1.70
        mark_threshold: 1
        unknown_threshold: 15
        combination_method: 1
        observation_sources: points
        points:
          topic: /points
          data_type: "PointCloud2"
          clearing: True
          marking: True
          min_obstacle_height: 0.20
          max_obstacle_height: 1.70
          raytrace_max_range: 4.0
          raytrace_min_range: 0.5
          obstacle_max_range: 4.0
          obstacle_min_range: 0.5
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        # Must exceed the inscribed radius (robot_radius 0.20 + 0.01 footprint
        # padding = 0.206 m), or inflation sits inside the robot's own body and
        # the planner paths closer than its radius. 0.35 leaves ~14 cm.
        inflation_radius: 0.35
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    # Aligned with the controller's FollowPath limits (max_vel_theta 0.3,
    # acc_lim_theta 0.8): min_rotational_vel used to be 0.4, i.e. the Spin
    # recovery asked for a rate the controller is not allowed to command.
    max_rotational_vel: 0.3
    min_rotational_vel: 0.15
    rotational_acc_lim: 0.8
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

# Collision monitor: independent safety stop on the L2, between the controller
# and the base (cmd_vel_raw -> monitor -> cmd_vel). Reads /points_safety, the
# L2 with Pepper's own body filtered out, or the robot would stop itself.
collision_monitor:
  ros__parameters:
    use_sim_time: False
    base_frame_id: "base_footprint"
    # map: this stack has no odom frame, and with the lookup failing the
    # monitor published no polygons at all. base_shift_correction only needs a
    # frame continuous over ~0.1 s, which map is here (2.1 cm median step).
    odom_frame_id: "map"
    cmd_vel_in_topic: "cmd_vel_raw"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    PolygonStop:
      type: "circle"
      radius: 0.40          # hard stop inside this radius of base_footprint
      action_type: "stop"
      max_points: 3         # trigger when > this many points fall inside
      visualize: True
      polygon_pub_topic: "polygon_stop"
      enabled: True
    PolygonSlow:
      type: "circle"
      radius: 0.80          # slow to slowdown_ratio inside this radius
      action_type: "slowdown"
      slowdown_ratio: 0.3
      max_points: 3
      visualize: True
      polygon_pub_topic: "polygon_slowdown"
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/points_safety"   # L2 minus its own housing (points_safety_filter)
      # 0.22, not 0.10: the L2 reads the floor up to ~0.20 m high within
      # 0.6 m, which filled both zones. MEASURED: no false trigger at 0.22.
      min_height: 0.22
      max_height: 1.80
      enabled: True
