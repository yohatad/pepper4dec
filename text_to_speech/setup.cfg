[develop]
script_dir=$base/lib/text_to_speech
[install]
install_scripts=$base/lib/text_to_speech
[options]

[tool:pytest]
# Scope colcon test's pytest run to test/ only. manual_tests/test_play_audio.py
# matches pytest's test_*.py discovery pattern but requires live robot/hardware
# access and takes positional args with no fixtures -- it must never be
# auto-collected.
testpaths = test