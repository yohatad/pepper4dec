# Behavior Controller Configuration File
# ROS2 parameters for the behavior_controller node (loaded via the launch file's
# `parameters=[...]`). Run `ros2 param get/set /behavior_controller <name>` to
# inspect or override these at runtime.
#
# Usage (standalone):
#   ros2 run behavior_controller behavior_controller \
#     --ros-args --params-file config/behavior_controller_configuration.yaml

behavior_controller:
  ros__parameters:

    # =========================================================================
    # Scenario Settings
    # =========================================================================

    # Name of the behavior tree XML to build at configure time, without the
    # .xml extension. Resolved against the package share directory.
    #
    # Every scenario except listen_cm_tts_pipeline gets visitor speech from
    # speech_event's /speech_recognition action, so the shipped speech_event
    # config (action_server: true) fits. listen_cm_tts_pipeline reads the
    # /speech_event/text topic instead and needs action_server: false.
    scenario_specification: "asr_cm_tts_pipeline"

    # lab_tour and dec_Tour: seconds to wait after a tour's goodbye before
    # looking for the next visitor, so the one who just left is not greeted
    # again. 0 starts looking at once.
    visitor_cooldown: 15.0

    # =========================================================================
    # Knowledge Base Settings
    # =========================================================================
    # Filenames are resolved relative to the package's data/ directory.

    culture_knowledge_base: "cultureKnowledgeBase.yaml"
    environment_knowledge_base: "decEnvironmentKnowledgeBase_short.yaml"

    # =========================================================================
    # Debug Settings
    # =========================================================================

    # Enable verbose logging of tree construction and per-tick state.
    verbose_mode: true
