# Static TF chain for the Pepper sensor rig (Unitree L2 + RealSense), published
# by ONE static_tf_publisher node. Geometry lives here as DATA.
#
# The camera edges (owner: driver) were recovered from bags/lidar_cam_calib2 --
# most bags recorded /tf_static with ZERO messages, so the RealSense internal
# extrinsics were never captured and multi-sensor SLAM could not start.
#
# l2lidar_frame -> camera_camera_link, the one edge that is ours to get right:
#   TRANSLATION  tape measure, 2026-08-04: L2 mounting plate centre to the
#     RealSense BACK face, X +0.62 mm, Y 0, Z +50.85 mm. The xyz below is that
#     offset to camera_camera_link, which is NOT a surface (it sits 4.3 mm
#     behind the front plate, per realsense2_description's _d435.urdf.xacro).
#     Re-derive from the plate; do not re-measure to this point directly.
#   ROTATION  measured 2026-08-06 by utils/plane_calib.py against
#     bag/corner_pose1: three planes segmented in both clouds, Kabsch on the
#     matched normals, mean of 4 reruns spreading 0.44 deg. Only the rotation
#     was taken -- the same runs scattered up to 25 mm in translation, so they
#     cannot improve on a direct measurement.
#   UNVERIFIED  no calibration agrees with the translation (closest 13.9 mm,
#     rest 20-61 mm), and Y=0 is inferred rather than measured. A target-based
#     calibration would settle all six DOF at once; NID-based direct
#     registration cannot -- the L2 panorama is ~77% empty toward the camera.
#   Calibrate against a manufactured-flat board, not a painted wall: a wall
#     sagging 89 mm over 4 m is not a plane, and RANSAC locks onto a different
#     fragment every run.
#
# Usage:  ros2 launch pepper_slam pepper_sensor_tf.launch.py
# Play the bag WITH /tf for wheel odometry (pepper_odom -> base_footprint lives
# in /tf, not /tf_static).

transforms:
  - {parent: base_footprint, child: l2lidar_frame,
     xyz: [0.133, 0.0, 0.2582],
     qxyzw: [0.69313, -0.147438, 0.690138, -0.14677]}
  # Rotation measured 2026-08-06; translation is the tape measure. See header.
  - {parent: l2lidar_frame, child: camera_camera_link,
     xyz: [0.038541, -0.036473, 0.021032],
     qxyzw: [0.674794, -0.166617, 0.703353, 0.148951]}
  - {parent: camera_camera_link, child: camera_color_frame, owner: driver,
     xyz: [-0.000237, 0.014846, 8.3e-05],
     qxyzw: [0.00419, 0.000544, 0.001321, 0.99999]}
  - {parent: camera_color_frame, child: camera_color_optical_frame, owner: driver,
     xyz: [0.0, 0.0, 0.0],
     qxyzw: [-0.5, 0.5, -0.5, 0.5]}
  - {parent: camera_camera_link, child: camera_depth_frame, owner: driver,
     xyz: [0.0, 0.0, 0.0],
     qxyzw: [0.0, 0.0, 0.0, 1.0]}
  - {parent: camera_depth_frame, child: camera_depth_optical_frame, owner: driver,
     xyz: [0.0, 0.0, 0.0],
     qxyzw: [-0.5, 0.5, -0.5, 0.5]}
  - {parent: camera_camera_link, child: camera_gyro_frame, owner: driver,
     xyz: [-0.01174, -0.00552, 0.0051],
     qxyzw: [0.0, 0.0, 0.0, 1.0]}
  - {parent: camera_gyro_frame, child: camera_imu_frame, owner: driver,
     xyz: [0.0, 0.0, 0.0],
     qxyzw: [0.0, 0.0, 0.0, 1.0]}
  - {parent: camera_imu_frame, child: camera_imu_optical_frame, owner: driver,
     xyz: [0.0, 0.0, 0.0],
     qxyzw: [-0.5, 0.5, -0.5, 0.5]}
  # NOT owner:driver, though l2lidar_node publishes it too: dropping it under
  # scope:=mount breaks every bag replay (no driver runs, and the LIO bridge
  # needs it to close odom -> base_footprint). Safe to duplicate because both
  # sources carry the identical Unitree spec value -- unlike the camera edges,
  # where the driver's device-read values can differ from these.
  - {parent: l2lidar_frame, child: l2lidar_frame_imu,
     xyz: [-0.007698, -0.014655, 0.00667],
     qxyzw: [0.0, 0.0, 0.0, 1.0]}
