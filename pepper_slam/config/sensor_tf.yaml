# Static TF chain for the Pepper sensor rig, published by ONE
# static_tf_publisher node (was 10 static_transform_publisher processes).
#
# Geometry lives here as DATA -- the provenance notes below are the
# original launch-file header and still apply to these numbers.
#
# Static TF tree for the Pepper sensor rig: Unitree L2 + RealSense (colour,
# depth, IMU).
#
# WHY THIS EXISTS: bags/slam_recording, slam_recording2 and slam_bench_run* were
# all recorded with /tf_static containing ZERO messages, so the RealSense driver's
# internal extrinsics (camera_link -> color/depth/gyro/accel) and the rig mount
# transforms were never captured. Without them RTAB-Map (or any multi-sensor SLAM)
# cannot relate the camera to the lidar and refuses to start.
#
# The values below were recovered from bags/lidar_cam_calib2, which is one of the
# few bags whose /tf_static was captured (4 messages).
#
# l2lidar_frame -> camera_camera_link: TRANSLATION IS MEASURED, ROTATION IS NOT.
#
# TRANSLATION (2026-08-04, tape measure, Yohannes): from the centre of the L2's
# mounting plate to the centre of the RealSense's BACK face (the one opposite
# the lenses):
#     X forward   +0.62 mm
#     Y lateral    0    mm   (camera sits directly above the lidar)
#     Z up        +50.85 mm
# The xyz below is that measurement expressed in l2lidar_frame, offset to
# camera_camera_link -- which is NOT a surface. Re-derive, do not re-measure to
# this point directly.
#
# CORRECTED 2026-08-06. This block previously said camera_link sits at
# "mid-depth", and the translation was derived on that basis. IT IS NOT AT
# MID-DEPTH. From realsense2_description/urdf/_d435.urdf.xacro:
#     d435_cam_depth          = 25.05 mm   (housing front to back)
#     d435_zero_depth_to_glass =  4.2 mm
#     d435_glass_to_front      =  0.1 mm
# so camera_link sits 4.3 mm behind the FRONT plate and therefore
#     camera_link -> BACK face = 25.05 - 4.3 = 20.75 mm,
# not the 12.53 mm half-depth that was assumed. Using half-depth put the
# camera's back face 7.79 mm BEHIND the L2 mounting plate instead of 0.5 mm in
# front of it -- an 8.29 mm error, first spotted in RViz where the RealSense
# body visibly sat behind the lidar's back cover.
#
# Y and Z were unaffected and are unchanged: camera_link is 17.5 mm off the
# width-centre (d435_cam_depth_py) and at mid-height (d435_cam_height/2), and
# both of those were already applied correctly.
#
# ROTATION MEASURED 2026-08-06 by utils/plane_calib.py (superseding the
# inherited value described below, which this block previously carried).
#   Source:  bag/corner_pose1, stationary window 77.5-101.7 s, the OUTWARD
#            (convex) corner -- flat faces, no skirting junction in view.
#   Method:  three mutually non-parallel planes segmented in the raw L2 cloud
#            (l2lidar_frame) and in the D435i depth cloud, rotation by Kabsch
#            on the matched normals. No IMU and no odometry in the path.
#   Result:  mean of 4 reruns, per-run deviation 0.12-0.44 deg, max spread
#            0.44 deg. Shifts the camera's forward axis by 1.36 deg.
#
# WHY ONLY THE ROTATION WAS TAKEN. The same 4 runs scattered in TRANSLATION by
# 12.6 mm (X), 9.2 mm (Y) and 24.9 mm (Z), and landed ~45 mm from the tape
# measure. Overwriting a direct measurement with a scattering estimate would be
# a regression, so xyz is unchanged.
#
# WHAT DOES NOT WORK, MEASURED. The other stationary window in the same bag
# (26.6-72.4 s, an ordinary room corner) is REJECTED: 1.8-2.0 deg rotation
# residual, and re-running it on identical data returned answers 30 mm apart.
# Cause diagnosed: the surface there sags 89 mm across its 3.95 x 5.57 m extent
# with clean U-shaped residual structure, so it is not a plane. RANSAC locks
# onto a different fragment each run, and the lidar was fitting a 5 m swath of
# wall while the camera fitted a 1 m patch of the same surface -- on a curved
# surface those cannot share a normal. Do not calibrate against painted walls;
# use a manufactured-flat board.
#
# HISTORICAL NOTE (still true, and now reproduced independently). Every earlier
# automated run agreed on rotation to within 0.6-1.8 deg while disagreeing on
# translation by up to 60 mm, so orientation is the one quantity those runs
# determined well. A tape measure cannot check it.
#
# WHY THE PREVIOUS VALUE WAS REPLACED. It came from one
# direct_visual_lidar_calibration run (koide3, NID) on lidar_cam_calib2 and was
# never verified. It is wrong:
#   * it placed camera_camera_link 33.4 mm from the L2 axis where the L2 body is
#     36.1 mm -- the camera's reference point inside the lidar housing;
#   * its back face sat 31.5 mm from the plate against 50.85 mm measured;
#   * it is not reproducible -- same bag, same seed, same tool re-run on
#     2026-08-04 returned 31.5 mm instead of 44.5 mm.
# Its 6.16 cm "refinement" over the CAD guess put 71% of the correction along
# the camera's depth axis, which a STATIC capture cannot constrain (no parallax).
# Seeded reruns spread 29.9 mm (1 bag), 58.6 mm (2 views), 97.2 mm (3 views).
#
# STILL UNVERIFIED. No calibration agrees with this measurement -- the closest
# is 13.9 mm away, the rest 20-61 mm. Rotation is assumed. Y=0 is inferred from
# the total distance, not measured directly. A target-based calibration
# (velo2cam_calibration or similar, which finds features geometrically rather
# than from lidar intensity) would settle all six DOF at once; NID-based direct
# registration cannot, because the L2's panorama is ~77% empty in the camera's
# direction and gives the objective too little to lock onto.
#
# Usage (include from another launch file, or run standalone):
#   ros2 launch pepper_slam pepper_sensor_tf.launch.py
#
# Play the bag WITH /tf if you want wheel odometry (pepper_odom -> base_footprint
# lives in /tf, not /tf_static).

transforms:
  - {parent: base_footprint, child: l2lidar_frame,
     xyz: [0.133, 0.0, 0.2582],
     qxyzw: [0.69313, -0.147438, 0.690138, -0.14677]}
  # ROTATION MEASURED 2026-08-06 (was inherited/unmeasured before this date).
  # TRANSLATION still the tape measure -- see the note above this block.
  - {parent: l2lidar_frame, child: camera_camera_link,
     xyz: [0.038541, -0.036473, 0.021032],
     qxyzw: [0.674794, -0.166617, 0.703353, 0.148951]}
  - {parent: camera_camera_link, child: camera_color_frame, owner: driver,
     xyz: [-0.000237, 0.014846, 8.3e-05],
     qxyzw: [0.00419, 0.000544, 0.001321, 0.99999]}
  - {parent: camera_color_frame, child: camera_color_optical_frame, owner: driver,
     xyz: [0.0, 0.0, 0.0],
     qxyzw: [-0.5, 0.5, -0.5, 0.5]}
  - {parent: camera_camera_link, child: camera_depth_frame, owner: driver,
     xyz: [0.0, 0.0, 0.0],
     qxyzw: [0.0, 0.0, 0.0, 1.0]}
  - {parent: camera_depth_frame, child: camera_depth_optical_frame, owner: driver,
     xyz: [0.0, 0.0, 0.0],
     qxyzw: [-0.5, 0.5, -0.5, 0.5]}
  - {parent: camera_camera_link, child: camera_gyro_frame, owner: driver,
     xyz: [-0.01174, -0.00552, 0.0051],
     qxyzw: [0.0, 0.0, 0.0, 1.0]}
  - {parent: camera_gyro_frame, child: camera_imu_frame, owner: driver,
     xyz: [0.0, 0.0, 0.0],
     qxyzw: [0.0, 0.0, 0.0, 1.0]}
  - {parent: camera_imu_frame, child: camera_imu_optical_frame, owner: driver,
     xyz: [0.0, 0.0, 0.0],
     qxyzw: [-0.5, 0.5, -0.5, 0.5]}
  # NOT owner:driver, even though l2lidar_node publishes this too
  # (publish_tf: true). Bag replay runs no driver, and the LIO bridge
  # needs base_footprint -> l2lidar_frame_imu to close
  # odom -> base_footprint, so dropping it under scope:=mount breaks
  # every bag-replay launch. The duplicate is harmless here because
  # both sources carry the IDENTICAL Unitree spec value
  # (l2lidar_node.cpp:719-727) -- unlike the camera edges, where the
  # driver's device-read values and these recovered ones can differ.
  - {parent: l2lidar_frame, child: l2lidar_frame_imu,
     xyz: [-0.007698, -0.014655, 0.00667],
     qxyzw: [0.0, 0.0, 0.0, 1.0]}
