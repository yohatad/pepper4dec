[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
exclude = launch/rtabmap_base.launch.py
# These two set OPENBLAS_NUM_THREADS before importing numpy (see their headers),
# so their imports cannot all be at the top of the file.
per-file-ignores =
    scripts/lio_odom_bridge.py:E402
    scripts/pgo_map_odom_bridge.py:E402
