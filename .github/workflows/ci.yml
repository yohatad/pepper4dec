name: CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

jobs:
  build-and-lint:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-perception-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/pepper4dec

      # Build tools only. Every package dependency comes from rosdep in the
      # next steps, so a dependency missing from a package.xml fails the build
      # here instead of being installed by hand and hidden.
      - name: Install build tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential cmake git \
            python3-colcon-common-extensions python3-vcstool python3-rosdep python3-pip

      - name: Clone sibling ROS2 dependencies
        run: |
          git clone https://github.com/yohatad/naoqi_bridge_msgs2.git src/naoqi_bridge_msgs
          git clone https://github.com/yohatad/naoqi_driver2.git src/naoqi_driver2
          git clone https://github.com/ros-naoqi/libqi.git -b ros2 src/naoqi_libqi
          git clone https://github.com/ros-naoqi/libqicore.git -b ros2 src/naoqi_libqicore
          git clone https://github.com/ros-naoqi/nao_meshes2.git src/nao_meshes
          git clone https://github.com/ros-naoqi/pepper_meshes2.git src/pepper_meshes
          git clone https://github.com/BehaviorTree/BehaviorTree.CPP.git src/BehaviorTree.CPP
          git clone https://github.com/BehaviorTree/BehaviorTree.ROS2.git src/BehaviorTree.ROS2

      - name: rosdep install
        run: |
          rosdep update
          # No -r: an unresolvable key fails the job. The skipped keys are
          # our own source repos, only needed at run time (exec_depend).
          rosdep install --from-paths src --ignore-src -y \
            --skip-keys "fast_lio point_lio l2lidar_node"

      - name: colcon build
        run: |
          . /opt/ros/humble/setup.sh
          colcon build --symlink-install

      # Runs linters, gtest and pytest unit tests across the packages, and the
      # person_detection bag-replay launch test. That test, and the pepper_slam
      # frame-contract test, self-skip here: the ONNX model and the sibling LIO
      # repos are absent in CI.
      - name: colcon test (lint + unit + launch tests)
        env:
          # Humble's ament_cppcheck skips every file on cppcheck 2.x (jammy
          # ships 2.7) unless this is set; without it the test reports
          # "skipped" and checks nothing.
          AMENT_CPPCHECK_ALLOW_SLOW_VERSIONS: "1"
        run: |
          . /opt/ros/humble/setup.sh
          . install/setup.sh
          colcon test
          colcon test-result --verbose
